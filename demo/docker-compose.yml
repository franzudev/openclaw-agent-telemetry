name: openclaw-agent-telemetry-demo

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: openclaw-telemetry-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:12.2.0
    container_name: openclaw-telemetry-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3215:3000"
    environment:
      # Demo-only: anonymous viewer, login form disabled. Do not expose beyond loopback.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3215
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
