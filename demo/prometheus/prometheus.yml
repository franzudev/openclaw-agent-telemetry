global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: openclaw-audit
    static_configs:
      # Run the exporter on the Docker host: `node exporter/exporter.mjs`
      - targets: ["host.docker.internal:3220"]
        labels:
          service: openclaw-observability
